# Single-server deployment: app + Postgres + Redis + Caddy (automatic HTTPS).
#   cp .env.example .env    # fill in DOMAIN, passwords, APP_SECRET, providers, S3_* …
#   docker compose up -d --build
# Optional self-hosted photo storage instead of S3/R2:  docker compose --profile minio up -d --build
# Only Caddy is exposed to the internet (80/443); app, database and Redis stay on the internal network.

name: drinking-buddies

services:
  app:
    build: .
    image: drinking-buddies:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"                                  # behind Caddy
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      DATABASE_URL: postgres://buddies:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/buddies
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - app-data:/app/data                              # only used by STORAGE_DRIVER=local
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["3000"]

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddies
      POSTGRES_DB: buddies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddies -d buddies"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters only: no persistence needed. Under memory pressure evict the keys
    # closest to expiring (every key has a TTL), never refuse writes.
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-ttl
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}                  # health check without the password on the command line
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ---- optional: self-hosted S3-compatible photo storage (profile "minio") ----
  # Set in .env: S3_BUCKET=buddies-photos S3_ENDPOINT=http://minio:9000 S3_FORCE_PATH_STYLE=1
  #              S3_REGION=us-east-1 S3_ACCESS_KEY_ID=<MINIO_ROOT_USER> S3_SECRET_ACCESS_KEY=<MINIO_ROOT_PASSWORD>
  # Keep PHOTO_DELIVERY=proxy: MinIO is internal and not reachable by browsers.
  minio:
    image: minio/minio:latest
    profiles: [minio]
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-buddies}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:                                           # creates the private bucket once
    image: minio/mc:latest
    profiles: [minio]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >-
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/$${S3_BUCKET:-buddies-photos} &&
             mc anonymous set none local/$${S3_BUCKET:-buddies-photos}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-buddies}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
      S3_BUCKET: ${S3_BUCKET:-buddies-photos}

volumes:
  app-data:
  pg-data:
  caddy-data:
  caddy-config:
  minio-data:
